name: CI and Deploy
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: course_user
          POSTGRES_PASSWORD: course_pass
          POSTGRES_DB: course_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U course_user -d course_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://course_user:course_pass@localhost:5432/course_db
      SECRET_KEY: ci-test-secret-key-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests --select F
      - run: alembic upgrade head
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/course_progress_api
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            alembic upgrade head
            sudo systemctl restart course-progress-api
            sleep 3
            curl --fail http://127.0.0.1/health
